[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-runtime"
version = "0.1.0"
description = "A testable, safety-oriented multi-agent runtime for repository work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

